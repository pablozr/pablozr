<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" fill="none">
<style>
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .in { animation: in .7s cubic-bezier(.2,.7,.2,1) backwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .in, .blink, .pulse { animation: none; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  
</defs>

<g class="in" style="animation-delay:0.00s">
  <rect x="0.5" y=".5" width="315" height="149" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="24" y="28" width="28" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="sans" x="24" y="82" font-size="44" font-weight="700" fill="url(#accent)" letter-spacing="-1">200+</text>
  <text class="sans" x="24" y="110" font-size="16" font-weight="600" fill="#1f2328">stores in production</text>
  <text class="sans" x="24" y="130" font-size="13.5" fill="#59636e">internal systems at Bagaggio</text>
</g>
<g class="in" style="animation-delay:0.15s">
  <rect x="342.5" y=".5" width="315" height="149" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="366" y="28" width="28" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="sans" x="366" y="82" font-size="44" font-weight="700" fill="url(#accent)" letter-spacing="-1">10+</text>
  <text class="sans" x="366" y="110" font-size="16" font-weight="600" fill="#1f2328">projects shipped</text>
  <text class="sans" x="366" y="130" font-size="13.5" fill="#59636e">from requirements to monitored deploy</text>
</g>
<g class="in" style="animation-delay:0.30s">
  <rect x="684.5" y=".5" width="315" height="149" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="708" y="28" width="28" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="sans" x="708" y="82" font-size="44" font-weight="700" fill="url(#accent)" letter-spacing="-1">605</text>
  <text class="sans" x="708" y="110" font-size="16" font-weight="600" fill="#1f2328">commits in 12 months</text>
  <text class="sans" x="708" y="130" font-size="13.5" fill="#59636e">across 21 repositories</text>
</g>
</svg>
