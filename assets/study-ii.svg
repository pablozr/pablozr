<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 250"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="Estudo II: cada regra na sua casa. Procuro manter cada regra de negócio perto de quem entende dela. Espalhada pelo controller, vira algo que ninguém consegue explicar, nem eu. Mensageria entra pelo mesmo motivo: quem publica um evento não precisa conhecer quem escuta.">
  <defs><filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.09  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.10 0"/>
    </filter></defs>
  <rect width="880" height="250" fill="#EFE8DA"/>
  
  <rect x="20" y="20" width="270" height="210" fill="none" stroke="#17150F" stroke-width="1"/>
  <line x1="36" y1="135" x2="274" y2="135" stroke="#17150F" stroke-width="1" stroke-dasharray="2 4"/><text x="270" y="128" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="9" fill="#6A6255" text-anchor="end">eventos</text><circle cx="95" cy="85" r="34" fill="#EFE8DA" stroke="#17150F" stroke-width="1.3"/><circle cx="95" cy="85" r="27" fill="none" stroke="#17150F" stroke-width="0.6" stroke-dasharray="2 3"/><text x="95" y="89" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="13" font-style="italic" fill="#17150F" text-anchor="middle">pedido</text><circle cx="215" cy="85" r="34" fill="#EFE8DA" stroke="#17150F" stroke-width="1.3"/><circle cx="215" cy="85" r="27" fill="none" stroke="#17150F" stroke-width="0.6" stroke-dasharray="2 3"/><text x="215" y="89" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="13" font-style="italic" fill="#17150F" text-anchor="middle">estoque</text><circle cx="155" cy="185" r="34" fill="#EFE8DA" stroke="#17150F" stroke-width="1.3"/><circle cx="155" cy="185" r="27" fill="none" stroke="#17150F" stroke-width="0.6" stroke-dasharray="2 3"/><text x="155" y="189" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="13" font-style="italic" fill="#17150F" text-anchor="middle">cobrança</text><line x1="95" y1="119" x2="95" y2="135" stroke="#17150F" stroke-width="1"/><line x1="215" y1="119" x2="215" y2="135" stroke="#17150F" stroke-width="1"/><line x1="155" y1="135" x2="155" y2="151" stroke="#17150F" stroke-width="1"/><circle r="5" fill="#D8432A">
    <animateMotion dur="6.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1"
                   path="M95 119 V135 H215 V119"/>
  </circle>
  <circle r="5" fill="#D8432A" opacity="0.9">
    <animateMotion dur="6.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.25;0.55;1"
                   path="M95 135 H155 V151"/>
  </circle>
  <text x="330" y="52" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10.5" fill="#D8432A" letter-spacing="2">ESTUDO II</text>
  <text x="330" y="86" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="27" font-style="italic" fill="#17150F" letter-spacing="-0.5">cada regra na sua casa</text>
  <text x="330" y="118" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">Procuro manter cada regra de negócio perto de quem entende</text><text x="330" y="140" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">dela. Espalhada pelo controller, vira algo que ninguém</text><text x="330" y="162" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">consegue explicar, nem eu. Mensageria entra pelo mesmo</text><text x="330" y="184" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">motivo: quem publica um evento não precisa conhecer quem</text><text x="330" y="206" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">escuta.</text>
  <rect width="880" height="250" filter="url(#grain)"/>
</svg>