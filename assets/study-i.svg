<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 250"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="Estudo I: duas requisições, um item. Concorrência só vira problema de verdade quando duas pessoas tentam comprar o último item ao mesmo tempo. A resposta não pode ser decidida depois: ou tem lock e transação explícita, ou o bug aparece em produção num sábado.">
  <defs><filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.09  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.10 0"/>
    </filter></defs>
  <rect width="880" height="250" fill="#EFE8DA"/>
  
  <rect x="20" y="20" width="270" height="210" fill="none" stroke="#17150F" stroke-width="1"/>
  
  <text x="36" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="9.5" fill="#6A6255" letter-spacing="1">req A</text>
  <text x="36" y="214" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="9.5" fill="#6A6255" letter-spacing="1">req B</text>
  <path d="M40 58 C 90 58, 110 125, 137 125" fill="none" stroke="#17150F" stroke-width="1.2"/>
  <path d="M40 192 C 90 192, 110 125, 137 125" fill="none" stroke="#17150F" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="139" y="109" width="32" height="32" fill="#EFE8DA" stroke="#17150F" stroke-width="1.5"/>
  <text x="155" y="129" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="11" fill="#17150F" text-anchor="middle">1</text>
  <text x="155" y="159" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="9" fill="#6A6255" text-anchor="middle">último item</text>
  <path d="M171 125 H 262" fill="none" stroke="#17150F" stroke-width="1.2"/>
  <text x="262" y="115" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="9" fill="#6A6255" text-anchor="end">commit</text>

  <circle r="6" fill="#D8432A">
    <animateMotion dur="5.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.4;1"
                   path="M40 58 C 90 58, 110 125, 137 125 H 262" calcMode="linear"/>
  </circle>
  <circle r="6" fill="#EFE8DA" stroke="#17150F" stroke-width="1.5">
    <animateMotion dur="5.0s" repeatCount="indefinite" keyPoints="0;0.92;0.92;0" keyTimes="0;0.38;0.8;1"
                   path="M40 192 C 90 192, 110 125, 137 125" calcMode="linear"/>
  </circle>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.34;0.8;1" dur="5.0s" repeatCount="indefinite"/>
    <rect x="148" y="91" width="14" height="11" fill="#D8432A"/>
    <path d="M151 91 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#D8432A" stroke-width="2"/>
    <text x="167" y="99" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="9" fill="#D8432A">lock</text>
  </g>
  <text x="330" y="52" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10.5" fill="#D8432A" letter-spacing="2">ESTUDO I</text>
  <text x="330" y="86" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="27" font-style="italic" fill="#17150F" letter-spacing="-0.5">duas requisições, um item</text>
  <text x="330" y="118" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">Concorrência só vira problema de verdade quando duas pessoas</text><text x="330" y="140" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">tentam comprar o último item ao mesmo tempo. A resposta não</text><text x="330" y="162" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">pode ser decidida depois: ou tem lock e transação explícita,</text><text x="330" y="184" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">ou o bug aparece em produção num sábado.</text>
  <rect width="880" height="250" filter="url(#grain)"/>
</svg>