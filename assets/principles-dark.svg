<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" fill="none">
<style>
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .in { animation: in .7s cubic-bezier(.2,.7,.2,1) backwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .in, .blink, .pulse { animation: none; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  
</defs>

<g class="in" style="animation-delay:0.00s">
  <rect x=".5" y="0.5" width="999" height="131" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x=".5" y="18" width="3" height="96" rx="1.5" fill="url(#accentV)"/>
  <text class="mono" x="32" y="44" font-size="13" fill="#22d3ee">01</text>
  <text class="sans" x="32" y="72" font-size="21" font-weight="700" fill="#e6edf3">Concurrency</text>
  <text class="sans" x="212" y="40" font-size="14.5" fill="#8b949e">Concurrency only gets real when two people try to buy the last</text><text class="sans" x="212" y="62" font-size="14.5" fill="#8b949e">item at the same time. That can't be decided later: either</text><text class="sans" x="212" y="84" font-size="14.5" fill="#8b949e">there is an explicit lock and transaction, or the bug shows up</text><text class="sans" x="212" y="106" font-size="14.5" fill="#8b949e">in production on a Saturday.</text>
  <rect x="660" y="23.5" width="316" height="85" rx="10" fill="#0b0f14" stroke="#30363d"/>
  <text class="mono" x="678" y="49.5" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">UPDATE </tspan><tspan fill="#e6edf3">stock </tspan><tspan fill="#ff7b72">SET </tspan><tspan fill="#e6edf3">qty = qty - </tspan><tspan fill="#79c0ff">1</tspan></text><text class="mono" x="678" y="70.5" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">WHERE </tspan><tspan fill="#e6edf3">sku = $1 </tspan><tspan fill="#ff7b72">AND </tspan><tspan fill="#e6edf3">qty &gt; </tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#e6edf3">;</tspan></text><text class="mono" x="678" y="91.5" font-size="13" xml:space="preserve"><tspan fill="#8b949e">-- 0 rows: sold out</tspan></text>
</g>
<g class="in" style="animation-delay:0.15s">
  <rect x=".5" y="146.5" width="999" height="131" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x=".5" y="164" width="3" height="96" rx="1.5" fill="url(#accentV)"/>
  <text class="mono" x="32" y="190" font-size="13" fill="#22d3ee">02</text>
  <text class="sans" x="32" y="218" font-size="21" font-weight="700" fill="#e6edf3">Domain</text>
  <text class="sans" x="212" y="186" font-size="14.5" fill="#8b949e">I keep each business rule close to whoever understands it.</text><text class="sans" x="212" y="208" font-size="14.5" fill="#8b949e">Scattered across controllers, it turns into something nobody</text><text class="sans" x="212" y="230" font-size="14.5" fill="#8b949e">can explain, me included. Messaging follows the same logic:</text><text class="sans" x="212" y="252" font-size="14.5" fill="#8b949e">whoever publishes an event doesn't need to know who listens.</text>
  <rect x="660" y="169.5" width="316" height="85" rx="10" fill="#0b0f14" stroke="#30363d"/>
  <text class="mono" x="678" y="195.5" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">await </tspan><tspan fill="#e6edf3">bus.</tspan><tspan fill="#d2a8ff">publish</tspan><tspan fill="#e6edf3">(</tspan></text><text class="mono" x="678" y="216.5" font-size="13" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#a5d6ff">"order.created"</tspan><tspan fill="#e6edf3">, event)</tspan></text><text class="mono" x="678" y="237.5" font-size="13" xml:space="preserve"><tspan fill="#8b949e"># who listens is not my problem</tspan></text>
</g>
<g class="in" style="animation-delay:0.30s">
  <rect x=".5" y="292.5" width="999" height="117" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x=".5" y="310" width="3" height="82" rx="1.5" fill="url(#accentV)"/>
  <text class="mono" x="32" y="336" font-size="13" fill="#22d3ee">03</text>
  <text class="sans" x="32" y="364" font-size="21" font-weight="700" fill="#e6edf3">Verification</text>
  <text class="sans" x="212" y="332" font-size="14.5" fill="#8b949e">Agents write code faster than I can review it, and better</text><text class="sans" x="212" y="354" font-size="14.5" fill="#8b949e">prompts don't fix that. That's why I started JevGuard.</text>
  <rect x="660" y="319.0" width="316" height="64" rx="10" fill="#0b0f14" stroke="#30363d"/>
  <text class="mono" x="678" y="345.0" font-size="13" xml:space="preserve"><tspan fill="#e6edf3">verdict </tspan><tspan fill="#ff7b72">= </tspan><tspan fill="#d2a8ff">gate</tspan><tspan fill="#e6edf3">(diff, rules)</tspan></text><text class="mono" x="678" y="366.0" font-size="13" xml:space="preserve"><tspan fill="#8b949e"># PASS · WARN · FAIL, decided locally</tspan></text>
</g>
</svg>
