<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="399" viewBox="0 0 1000 399" fill="none">
<style>
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
</style>
<text class="m" x="0" y="22" font-size="14" fill="#ff6a3d" letter-spacing="1">01</text>
<text class="s" x="0" y="56" font-size="22" fill="#e6e6e3" font-weight="600">Concurrency</text>
<text class="s" x="0" y="92" font-size="17.5" fill="#9aa0a8">Concurrency only gets real when</text>
<text class="s" x="0" y="119" font-size="17.5" fill="#9aa0a8">two people try to buy the last</text>
<text class="s" x="0" y="146" font-size="17.5" fill="#9aa0a8">item at the same time. That can't</text>
<text class="s" x="0" y="173" font-size="17.5" fill="#9aa0a8">be decided later: either there is</text>
<text class="s" x="0" y="200" font-size="17.5" fill="#9aa0a8">an explicit lock and transaction,</text>
<text class="s" x="0" y="227" font-size="17.5" fill="#9aa0a8">or the bug shows up in production</text>
<text class="s" x="0" y="254" font-size="17.5" fill="#9aa0a8">on a Saturday.</text>
<line x1="0" y1="302" x2="300" y2="302" stroke="#30363d" stroke-width="1" stroke-dasharray="2 3"/>
<text class="m" x="0" y="328" font-size="14.5" fill="#e6e6e3" xml:space="preserve">UPDATE stock SET qty = qty - 1</text>
<text class="m" x="0" y="351" font-size="14.5" fill="#e6e6e3" xml:space="preserve"> WHERE sku = $1 AND qty &gt; 0;</text>
<text class="m" x="0" y="374" font-size="14.5" fill="#646b75" xml:space="preserve">-- 0 rows: sold out</text>
<line x1="325.0" y1="6" x2="325.0" y2="393" stroke="#30363d" stroke-width="1"/>
<text class="m" x="350" y="22" font-size="14" fill="#ff6a3d" letter-spacing="1">02</text>
<text class="s" x="350" y="56" font-size="22" fill="#e6e6e3" font-weight="600">Domain</text>
<text class="s" x="350" y="92" font-size="17.5" fill="#9aa0a8">I keep each business rule close</text>
<text class="s" x="350" y="119" font-size="17.5" fill="#9aa0a8">to whoever understands it.</text>
<text class="s" x="350" y="146" font-size="17.5" fill="#9aa0a8">Scattered across controllers, it</text>
<text class="s" x="350" y="173" font-size="17.5" fill="#9aa0a8">turns into something nobody can</text>
<text class="s" x="350" y="200" font-size="17.5" fill="#9aa0a8">explain, me included. Messaging</text>
<text class="s" x="350" y="227" font-size="17.5" fill="#9aa0a8">follows the same logic: whoever</text>
<text class="s" x="350" y="254" font-size="17.5" fill="#9aa0a8">publishes an event doesn't need</text>
<text class="s" x="350" y="281" font-size="17.5" fill="#9aa0a8">to know who listens.</text>
<line x1="350" y1="302" x2="650" y2="302" stroke="#30363d" stroke-width="1" stroke-dasharray="2 3"/>
<text class="m" x="350" y="328" font-size="14.5" fill="#e6e6e3" xml:space="preserve">bus.publish("order.created", e)</text>
<text class="m" x="350" y="351" font-size="14.5" fill="#646b75" xml:space="preserve"># who listens is not my problem</text>
<line x1="675.0" y1="6" x2="675.0" y2="393" stroke="#30363d" stroke-width="1"/>
<text class="m" x="700" y="22" font-size="14" fill="#ff6a3d" letter-spacing="1">03</text>
<text class="s" x="700" y="56" font-size="22" fill="#e6e6e3" font-weight="600">Verification</text>
<text class="s" x="700" y="92" font-size="17.5" fill="#9aa0a8">Agents write code faster than I</text>
<text class="s" x="700" y="119" font-size="17.5" fill="#9aa0a8">can review it, and better prompts</text>
<text class="s" x="700" y="146" font-size="17.5" fill="#9aa0a8">don't fix that. That's why I</text>
<text class="s" x="700" y="173" font-size="17.5" fill="#9aa0a8">started JevGuard.</text>
<line x1="700" y1="302" x2="1000" y2="302" stroke="#30363d" stroke-width="1" stroke-dasharray="2 3"/>
<text class="m" x="700" y="328" font-size="14.5" fill="#e6e6e3" xml:space="preserve">verdict = gate(diff, rules)</text>
<text class="m" x="700" y="351" font-size="14.5" fill="#646b75" xml:space="preserve"># PASS | WARN | FAIL, local</text>
</svg>
