<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="298" viewBox="0 0 1000 298" fill="none">
<style>
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .scan { animation: scan 11s linear infinite; }
  @keyframes scan { from { transform: translateX(0); } to { transform: translateX(840px); } }
  @media (prefers-reduced-motion: reduce) { .scan { animation: none; opacity: 0; } }
</style>
<defs></defs>
<text class="m" x="0" y="18" font-size="11" fill="#ff6a3d" letter-spacing="1">01</text>
<text class="s" x="0" y="46" font-size="17" fill="#e6e6e3" font-weight="600">Concurrency</text>
<text class="s" x="0" y="76" font-size="14" fill="#8b9098">Concurrency only gets real when two</text>
<text class="s" x="0" y="97" font-size="14" fill="#8b9098">people try to buy the last item at the</text>
<text class="s" x="0" y="118" font-size="14" fill="#8b9098">same time. That can't be decided later:</text>
<text class="s" x="0" y="139" font-size="14" fill="#8b9098">either there is an explicit lock and</text>
<text class="s" x="0" y="160" font-size="14" fill="#8b9098">transaction, or the bug shows up in</text>
<text class="s" x="0" y="181" font-size="14" fill="#8b9098">production on a Saturday.</text>
<line x1="0" y1="215" x2="310" y2="215" stroke="#30363d" stroke-width="1" stroke-dasharray="2 3"/>
<text class="m" x="0" y="237" font-size="12" fill="#e6e6e3" xml:space="preserve">UPDATE stock SET qty = qty - 1</text>
<text class="m" x="0" y="256" font-size="12" fill="#e6e6e3" xml:space="preserve"> WHERE sku = $1 AND qty &gt; 0;</text>
<text class="m" x="0" y="275" font-size="12" fill="#5b616b" xml:space="preserve">-- 0 rows: sold out</text>
<line x1="327.5" y1="4" x2="327.5" y2="294" stroke="#30363d" stroke-width="1"/>
<text class="m" x="345" y="18" font-size="11" fill="#ff6a3d" letter-spacing="1">02</text>
<text class="s" x="345" y="46" font-size="17" fill="#e6e6e3" font-weight="600">Domain</text>
<text class="s" x="345" y="76" font-size="14" fill="#8b9098">I keep each business rule close to</text>
<text class="s" x="345" y="97" font-size="14" fill="#8b9098">whoever understands it. Scattered across</text>
<text class="s" x="345" y="118" font-size="14" fill="#8b9098">controllers, it turns into something</text>
<text class="s" x="345" y="139" font-size="14" fill="#8b9098">nobody can explain, me included.</text>
<text class="s" x="345" y="160" font-size="14" fill="#8b9098">Messaging follows the same logic:</text>
<text class="s" x="345" y="181" font-size="14" fill="#8b9098">whoever publishes an event doesn't need</text>
<text class="s" x="345" y="202" font-size="14" fill="#8b9098">to know who listens.</text>
<line x1="345" y1="215" x2="655" y2="215" stroke="#30363d" stroke-width="1" stroke-dasharray="2 3"/>
<text class="m" x="345" y="237" font-size="12" fill="#e6e6e3" xml:space="preserve">await bus.publish("order.created", e)</text>
<text class="m" x="345" y="256" font-size="12" fill="#5b616b" xml:space="preserve"># who listens is not my problem</text>
<line x1="672.5" y1="4" x2="672.5" y2="294" stroke="#30363d" stroke-width="1"/>
<text class="m" x="690" y="18" font-size="11" fill="#ff6a3d" letter-spacing="1">03</text>
<text class="s" x="690" y="46" font-size="17" fill="#e6e6e3" font-weight="600">Verification</text>
<text class="s" x="690" y="76" font-size="14" fill="#8b9098">Agents write code faster than I can</text>
<text class="s" x="690" y="97" font-size="14" fill="#8b9098">review it, and better prompts don't fix</text>
<text class="s" x="690" y="118" font-size="14" fill="#8b9098">that. That's why I started JevGuard.</text>
<line x1="690" y1="215" x2="1000" y2="215" stroke="#30363d" stroke-width="1" stroke-dasharray="2 3"/>
<text class="m" x="690" y="237" font-size="12" fill="#e6e6e3" xml:space="preserve">verdict = gate(diff, rules)</text>
<text class="m" x="690" y="256" font-size="12" fill="#5b616b" xml:space="preserve"># PASS | WARN | FAIL, decided locally</text>
</svg>
