  <text x="330.7" y="118" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15" font-style="italic" fill="#17150F">projetos entregues</text>
  <text x="330.7" y="136" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10.5" fill="#6A6255">do requisito ao deploy monitorado</text><line x1="577.3" y1="26" x2="577.3" y2="140" stroke="#17150F" stroke-width="1"/>
