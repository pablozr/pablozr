  <text x="605.3" y="136" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10.5" fill="#6A6255">21 repositórios com contribuições</text>
