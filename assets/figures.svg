  <text x="28.0" y="136" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10.5" fill="#6A6255">sistemas internos na Bagaggio</text><line x1="302.7" y1="26" x2="302.7" y2="140" stroke="#17150F" stroke-width="1"/>
  <text x="330.7" y="40" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10.5" fill="#D8432A" letter-spacing="1.5">FIG. 2</text>
