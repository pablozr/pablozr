<svg xmlns="http://www.w3.org/2000/svg" width="490" height="230" viewBox="0 0 490 230" fill="none">
<style>
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .in { animation: in .7s cubic-bezier(.2,.7,.2,1) backwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .in, .blink, .pulse { animation: none; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  
</defs>

<g class="in">
<rect x=".5" y=".5" width="489" height="229" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x=".5" y="20" width="3" height="190" rx="1.5" fill="url(#accentV)"/>
<path transform="translate(28 24)" fill="#59636e" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
<text class="mono" x="52" y="37" font-size="13" fill="#59636e">pablozr / <tspan fill="#1f2328">JevGuard</tspan></text>
<circle cx="377.0" cy="32" r="6" fill="#3178c6"/>
<text class="sans" x="462" y="37" font-size="13" fill="#59636e" text-anchor="end">TypeScript</text>
<text class="sans" x="28" y="80" font-size="23" font-weight="700" fill="#1f2328" letter-spacing="-.4">JevGuard</text>
<text class="sans" x="28" y="106" font-size="14.5" font-weight="600" fill="url(#accent)">Semantic policy engine for coding agents</text>
<text class="sans" x="28" y="134" font-size="13.5" fill="#59636e">Checks the diff a coding agent just produced against your</text><text class="sans" x="28" y="153" font-size="13.5" fill="#59636e">repository's policies. Each rule gets a semantic judgment, and</text><text class="sans" x="28" y="172" font-size="13.5" fill="#59636e">a local deterministic gate returns PASS, WARN or FAIL.</text>
<rect x="28" y="186" width="92" height="24" rx="12" fill="#eaeef2"/><text class="mono" x="74" y="202" font-size="12" fill="#1f2328" text-anchor="middle">typescript</text><rect x="128.0" y="186" width="40" height="24" rx="12" fill="#eaeef2"/><text class="mono" x="148" y="202" font-size="12" fill="#1f2328" text-anchor="middle">cli</text><rect x="176.2" y="186" width="114" height="24" rx="12" fill="#eaeef2"/><text class="mono" x="233" y="202" font-size="12" fill="#1f2328" text-anchor="middle">policy-engine</text>
</g>
</svg>
