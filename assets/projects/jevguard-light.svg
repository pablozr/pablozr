<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="114" viewBox="0 0 1000 114" fill="none">
<style>
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .scan { animation: scan 11s linear infinite; }
  @keyframes scan { from { transform: translateX(0); } to { transform: translateX(840px); } }
  @media (prefers-reduced-motion: reduce) { .scan { animation: none; opacity: 0; } }
</style>
<defs></defs>
<line x1="0" y1="0.5" x2="1000" y2="0.5" stroke="#d0d7de" stroke-width="1"/>
<text class="m" x="0" y="32" font-size="11" fill="#d9480f" letter-spacing="1">01</text>
<text class="s" x="40" y="34" font-size="19" fill="#16181d" font-weight="600" letter-spacing="-0.3">JevGuard</text>
<text class="m" x="40" y="56" font-size="11" fill="#9aa1ab">pablozr/JevGuard <tspan fill="#d9480f">↗</tspan></text>
<text class="s" x="330" y="32" font-size="14" fill="#5f6670">Semantic policy engine for coding agents. Checks the diff an</text>
<text class="s" x="330" y="52" font-size="14" fill="#5f6670">agent just produced against the repository's policies; each rule</text>
<text class="s" x="330" y="72" font-size="14" fill="#5f6670">gets a semantic judgment and a local deterministic gate returns</text>
<text class="s" x="330" y="92" font-size="14" fill="#5f6670">PASS, WARN or FAIL.</text>
<text class="m" x="1000" y="32" font-size="12" fill="#16181d" text-anchor="end">TypeScript</text>
<text class="m" x="1000" y="52" font-size="11" fill="#9aa1ab" text-anchor="end">cli</text>
<text class="m" x="1000" y="69" font-size="11" fill="#9aa1ab" text-anchor="end">policy-engine</text>
</svg>
