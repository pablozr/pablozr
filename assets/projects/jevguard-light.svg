<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="175" viewBox="0 0 1000 175" fill="none">
<style>
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
</style>
<line x1="0" y1="0.5" x2="1000" y2="0.5" stroke="#d0d7de" stroke-width="1"/>
<text class="m" x="0" y="38" font-size="14" fill="#d9480f" letter-spacing="1">01</text>
<text class="s" x="44" y="40" font-size="23" fill="#16181d" font-weight="600" letter-spacing="-0.4">JevGuard</text>
<text class="m" x="44" y="66" font-size="13" fill="#8c939d">pablozr/JevGuard <tspan fill="#d9480f">↗</tspan></text>
<text class="s" x="350" y="38" font-size="17" fill="#555c66">Semantic policy engine for coding agents. Checks</text>
<text class="s" x="350" y="63" font-size="17" fill="#555c66">the diff an agent just produced against the</text>
<text class="s" x="350" y="88" font-size="17" fill="#555c66">repository's policies; each rule gets a semantic</text>
<text class="s" x="350" y="113" font-size="17" fill="#555c66">judgment and a local deterministic gate returns</text>
<text class="s" x="350" y="138" font-size="17" fill="#555c66">PASS, WARN or FAIL.</text>
<text class="m" x="1000" y="38" font-size="15" fill="#16181d" text-anchor="end">TypeScript</text>
<text class="m" x="1000" y="62" font-size="13.5" fill="#8c939d" text-anchor="end">cli</text>
<text class="m" x="1000" y="83" font-size="13.5" fill="#8c939d" text-anchor="end">policy-engine</text>
</svg>
