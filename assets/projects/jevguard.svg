  <text x="34" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A8A39A">Verifica o diff que um agente acabou de produzir contra as políticas do repositório. Cada regra</text><text x="34" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A8A39A">recebe um julgamento semântico e um gate determinístico local devolve o veredito.</text>
