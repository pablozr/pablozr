  <text x="26" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A8A39A">Carrinho anônimo por mesa em Redis, checkout Stripe</text><text x="26" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A8A39A">idempotente, reset de senha assíncrono com RabbitMQ e</text><text x="26" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A8A39A">worker SMTP, catálogo com cache por produto.</text>
