<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="111" viewBox="0 0 1000 111" fill="none">
<style>
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .scan { animation: scan 11s linear infinite; }
  @keyframes scan { from { transform: translateX(0); } to { transform: translateX(840px); } }
  @media (prefers-reduced-motion: reduce) { .scan { animation: none; opacity: 0; } }
</style>
<defs></defs>
<line x1="0" y1="0.5" x2="1000" y2="0.5" stroke="#30363d" stroke-width="1"/>
<text class="m" x="0" y="32" font-size="11" fill="#ff6a3d" letter-spacing="1">03</text>
<text class="s" x="40" y="34" font-size="19" fill="#e6e6e3" font-weight="600" letter-spacing="-0.3">PRISMA</text>
<text class="m" x="40" y="56" font-size="11" fill="#5b616b">pablozr/PRISMA <tspan fill="#ff6a3d">↗</tspan></text>
<text class="s" x="330" y="32" font-size="14" fill="#8b9098">Academic platform for UNIRIO. Projects imported from SIE,</text>
