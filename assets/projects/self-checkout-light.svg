<line x1="0" y1="0.5" x2="1000" y2="0.5" stroke="#d0d7de" stroke-width="1"/>
<text class="m" x="0" y="38" font-size="14" fill="#d9480f" letter-spacing="1">04</text>
<text class="s" x="44" y="40" font-size="23" fill="#16181d" font-weight="600" letter-spacing="-0.4">self-checkout-monolith</text>
<text class="m" x="44" y="66" font-size="13" fill="#8c939d">pablozr/self-checkout-monolith <tspan fill="#d9480f">↗</tspan></text>
<text class="s" x="350" y="38" font-size="17" fill="#555c66">Table-side self-checkout. Anonymous per-table cart</text>
<text class="s" x="350" y="63" font-size="17" fill="#555c66">in Redis, idempotent Stripe checkout, async</text>
<text class="s" x="350" y="88" font-size="17" fill="#555c66">password reset with an SMTP worker, per-product</text>
<text class="s" x="350" y="113" font-size="17" fill="#555c66">caching.</text>
<text class="m" x="1000" y="38" font-size="15" fill="#16181d" text-anchor="end">Python</text>
<text class="m" x="1000" y="62" font-size="13.5" fill="#8c939d" text-anchor="end">fastapi</text>
<text class="m" x="1000" y="83" font-size="13.5" fill="#8c939d" text-anchor="end">redis</text>
<text class="m" x="1000" y="104" font-size="13.5" fill="#8c939d" text-anchor="end">rabbitmq</text>
<text class="m" x="1000" y="125" font-size="13.5" fill="#8c939d" text-anchor="end">stripe</text>
