<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
<style>
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .in { animation: in .7s cubic-bezier(.2,.7,.2,1) backwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 6s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .in, .blink, .pulse { animation: none; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  
  <clipPath id="frame"><rect x="1" y="1" width="998" height="298" rx="16"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#21262d"/>
  </pattern>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".20"/>
    <stop offset=".5" stop-color="#22d3ee" stop-opacity=".06"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x=".5" y=".5" width="999" height="299" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="998" height="298" rx="16" fill="url(#dots)"/>
<circle class="pulse" cx="760" cy="40" r="260" fill="url(#glow)" clip-path="url(#frame)"/>
<rect x="1" y="1" width="998" height="3" rx="1.5" fill="url(#accent)"/>

<text class="mono in" x="48" y="92" font-size="15" fill="#8b949e">// hello, world. I'm</text>
<text class="sans in" style="animation-delay:.1s" x="46" y="152" font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Pablo Farina</text>
<text class="sans in" style="animation-delay:.2s" x="48" y="194" font-size="24" font-weight="600" fill="url(#accent)">Backend Engineer</text>
<text class="sans in" style="animation-delay:.3s" x="48" y="230" font-size="15.5" fill="#8b949e">Concurrency · Architecture · Coding-agent verification</text>
<text class="mono in" style="animation-delay:.4s" x="48" y="264" font-size="13" fill="#8b949e">
  <tspan fill="#22d3ee">◆</tspan> Rio de Janeiro, Brazil  <tspan fill="#22d3ee">◆</tspan> Information Systems @ UNIRIO</text>

<g class="in" style="animation-delay:.3s">
  <rect x="548" y="38" width="412" height="224" rx="12" fill="#0b0f14" stroke="#30363d"/>
  <path d="M548 50a12 12 0 0 1 12-12h388a12 12 0 0 1 12 12v24h-412z" fill="#161b22"/>
  <line x1="548" y1="74" x2="960" y2="74" stroke="#30363d"/>
  <circle cx="568" cy="56" r="5.5" fill="#ff5f57"/>
  <circle cx="586" cy="56" r="5.5" fill="#febc2e"/>
  <circle cx="604" cy="56" r="5.5" fill="#28c840"/>
  <text class="mono" x="754.0" y="61" font-size="12" fill="#8b949e" text-anchor="middle">pablo@rio: ~</text>
</g>
<text class="mono in" style="animation-delay:0.50s" x="570" y="114" font-size="13.5"><tspan fill="#22d3ee">$ </tspan><tspan fill="#e6edf3">cat focus.yml</tspan></text>
<text class="mono in" style="animation-delay:0.75s" x="570" y="141" font-size="13.5"><tspan fill="#d2a8ff">backend:      </tspan><tspan fill="#8b949e">FastAPI · async · event-driven</tspan></text>
<text class="mono in" style="animation-delay:1.00s" x="570" y="168" font-size="13.5"><tspan fill="#d2a8ff">architecture: </tspan><tspan fill="#8b949e">concurrency as an invariant</tspan></text>
<text class="mono in" style="animation-delay:1.25s" x="570" y="195" font-size="13.5"><tspan fill="#d2a8ff">agents:       </tspan><tspan fill="#8b949e">JevGuard · diff verification</tspan></text>
<text class="mono in" style="animation-delay:1.50s" x="570" y="222" font-size="13.5"><tspan fill="#d2a8ff">research:     </tspan><tspan fill="#8b949e">embeddings &amp; retrieval</tspan></text>
<text class="mono in" style="animation-delay:1.75s" x="570" y="249" font-size="13.5" fill="#22d3ee">$ <tspan class="blink" fill="#e6edf3">▍</tspan></text>

</svg>
