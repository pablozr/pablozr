<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 250"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="Estudo III: o agente escreve, alguém verifica. Agora estou preso em verificação. Agente escreve mais rápido do que eu consigo revisar, e prompt melhor não resolve isso. Foi por isso que o JevGuard começou.">
  <defs><filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.09  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.10 0"/>
    </filter></defs>
  <rect width="880" height="250" fill="#EFE8DA"/>
  
  <rect x="20" y="20" width="270" height="210" fill="none" stroke="#17150F" stroke-width="1"/>
  <text x="38" y="56" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10" fill="#17150F">+</text><rect x="52" y="49" width="150" height="6" fill="#17150F" opacity="0.75"/><text x="38" y="74" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10" fill="#17150F">+</text><rect x="52" y="67" width="120" height="6" fill="#17150F" opacity="0.75"/><text x="38" y="92" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10" fill="#17150F">-</text><rect x="52" y="85" width="170" height="6" fill="#17150F" opacity="0.75"/><text x="38" y="110" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10" fill="#17150F">+</text><rect x="52" y="103" width="90" height="6" fill="#17150F" opacity="0.75"/><text x="38" y="128" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10" fill="#17150F">+</text><rect x="52" y="121" width="140" height="6" fill="#17150F" opacity="0.75"/><text x="38" y="146" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10" fill="#D8432A">+</text><rect x="52" y="139" width="110" height="6" fill="#D8432A" opacity="0.9"/><text x="38" y="164" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10" fill="#17150F">+</text><rect x="52" y="157" width="160" height="6" fill="#17150F" opacity="0.75"/><text x="38" y="182" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10" fill="#17150F">-</text><rect x="52" y="175" width="130" height="6" fill="#17150F" opacity="0.75"/><g>
    <line x1="30" y1="0" x2="238" y2="0" stroke="#D8432A" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 40;0 190;0 190" keyTimes="0;0.7;1"
                      dur="7.0s" repeatCount="indefinite"/>
  </g>
  <rect x="238" y="40" width="34" height="150" fill="none" stroke="#17150F" stroke-width="1.3"/>
  <text x="255" y="110" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="9" fill="#17150F" text-anchor="middle" transform="rotate(-90 255 110)">gate</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.95;1" dur="7.0s" repeatCount="indefinite"/>
    <text x="155" y="214" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="11" fill="#D8432A" text-anchor="middle" letter-spacing="2">FAIL · fora do escopo</text>
  </g>
  <text x="330" y="52" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="10.5" fill="#D8432A" letter-spacing="2">ESTUDO III</text>
  <text x="330" y="86" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="27" font-style="italic" fill="#17150F" letter-spacing="-0.5">o agente escreve, alguém verifica</text>
  <text x="330" y="118" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">Agora estou preso em verificação. Agente escreve mais rápido</text><text x="330" y="140" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">do que eu consigo revisar, e prompt melhor não resolve isso.</text><text x="330" y="162" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="15.5" fill="#17150F">Foi por isso que o JevGuard começou.</text>
  <rect width="880" height="250" filter="url(#grain)"/>
</svg>